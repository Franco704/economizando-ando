<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Economizando Ando</title>
  <meta name="description" content="Guía de estudio de Economía (UTN-FRT) con gráficas interactivas: Microeconomía (primer parcial) y Macroeconomía (segundo parcial), con los trabajos prácticos y los parciales de la cátedra resueltos." />
  <meta name="theme-color" content="#f1f4ef" media="(prefers-color-scheme: light)" />
  <meta name="theme-color" content="#101511" media="(prefers-color-scheme: dark)" />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@100..125,400..800&family=Source+Serif+4:ital,opsz,wght@0,8..60,400..700;1,8..60,400&display=swap" />
  <link rel="stylesheet" href="styles/tokens.css" />
  <link rel="stylesheet" href="styles/base.css" />
  <link rel="stylesheet" href="styles/armazon.css" />
  <link rel="stylesheet" href="styles/contenido.css" />
  <link rel="stylesheet" href="styles/estudio.css" />
  <link rel="stylesheet" href="styles/laboratorios.css" />
  <link rel="stylesheet" href="styles/vistas.css" />
  <link rel="stylesheet" href="styles/animaciones.css" />
  <script>
    // Tema guardado antes de pintar, para evitar el parpadeo
    try { const t = localStorage.getItem('ec-theme'); if (t) document.documentElement.dataset.theme = t; } catch (e) {}
  </script>
  <script type="module" src="src/main.js"></script>
</head>
<body>
  <a class="saltar" href="#principal">Saltar al contenido</a>

  <header class="barra">
    <button class="boton-icono boton-menu" id="botonMenu" type="button" aria-label="Abrir el índice" aria-expanded="false" aria-controls="cajon"></button>
    <a class="marca" href="#/"><span class="marca-signo" aria-hidden="true"><i></i><i></i><i></i></span>Economizando Ando</a>
    <nav class="barra-enlaces" aria-label="Herramientas de estudio" id="barraEnlaces"></nav>
    <div class="avance" id="avance"></div>
    <button class="boton-icono" id="botonTema" type="button" aria-label="Cambiar entre tema claro y oscuro"></button>
  </header>

  <div class="marco">
    <nav class="cajon" id="cajon" aria-label="Índice de la materia">
      <div class="cajon-cabeza">
        <p>Índice</p>
        <button class="boton-icono" id="cerrarCajon" type="button" aria-label="Cerrar el índice"></button>
      </div>
      <label class="buscar">
        <span class="sr-only">Buscar un tema</span>
        <input type="search" id="buscar" placeholder="Buscar: elasticidad, Gini, IPC…" autocomplete="off" />
      </label>
      <ul class="herramientas" id="herramientas"></ul>
      <div id="indice"></div>
      <a class="hub" href="https://utn-ando.github.io/">Ver las otras materias en UTN Ando</a>
    </nav>
    <div class="velo" id="velo" hidden></div>
    <main id="principal" tabindex="-1">
      <noscript><p>Esta guía necesita JavaScript para las gráficas y las preguntas.</p></noscript>
    </main>
    <aside class="riel" id="riel" aria-label="En esta lección"></aside>
  </div>

  <nav class="dock" aria-label="Accesos rápidos" id="dock"></nav>
</body>
</html>
